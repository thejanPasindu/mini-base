# mini-base stack.
#
#   cp .env.example .env      # then edit it
#   docker compose up -d --build
#
# What starts is controlled from .env:
#   MINIBASE_MODULES   which features run inside minibase (auth, storage, ...)
#   COMPOSE_PROFILES   which extra containers run next to it:
#       db    bundled PostgreSQL (default). Remove it to use your own Postgres
#             via MINIBASE_DATABASE_URL (Neon, RDS, a server on your LAN...).
#       dev   Mailpit, catches auth emails at http://localhost:8025
#       s3    MinIO, for the S3 storage driver

name: minibase

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-} # required when the db profile is on
      POSTGRES_DB: minibase
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minibase"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Bound to localhost only, for psql / DBeaver / TablePlus on your machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  minibase:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: ${MINIBASE_VERSION:-dev}
    image: minibase:${MINIBASE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false # ignored when the db profile is off (Compose ≥ 2.20)
    env_file: .env
    environment:
      # Defaults to the bundled container; set MINIBASE_DATABASE_URL in .env to override.
      MINIBASE_DATABASE_URL: ${MINIBASE_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-}@postgres:5432/minibase?sslmode=disable}
    ports:
      - "${MINIBASE_PORT:-8090}:8090"

  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025" # web UI

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001" # console

volumes:
  pgdata:
  miniodata:
