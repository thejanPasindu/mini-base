version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - errorlint
    - gocyclo
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
    wrapcheck:
      ignore-package-globs:
        - github.com/mini-base/mini-base/*
    depguard:
      rules:
        kernel:
          files: ["**/internal/kernel/**"]
          deny:
            - pkg: github.com/mini-base/mini-base/internal/modules
              desc: the kernel must never depend on a module
        domain:
          files: ["**/internal/modules/*/domain/**"]
          deny:
            - pkg: github.com/jackc
              desc: domain code has no I/O
            - pkg: net/http
              desc: domain code has no I/O
  exclusions:
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [wrapcheck, gosec, containedctx, noctx, bodyclose]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/mini-base/mini-base]
